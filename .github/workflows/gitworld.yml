name: GitWorld — living contribution city

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Dasmat13/git-world-action@main
        with:
          github_user_name: arshiljain
          github_token: ${{ secrets.GITHUB_TOKEN }}
          svg_out_path: art/gitworld.svg
      - name: Commit world
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add art/gitworld.svg
          git commit -m "chore: refresh contribution world" || true
          git push